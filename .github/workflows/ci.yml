name: CI

# Gemeinsamen Actions-Verbrauch sparsam halten:
# - Automatisch läuft nur die schnelle Prüfung (rund 3 Minuten), und zwar bei
#   allen Pushes auf main und allen Pull Requests, auch bei reiner Doku.
#   Keine Pfadfilter: Pflichtprüfungen und Render checksPass brauchen für jeden
#   relevanten Commit ein Ergebnis. Andere Branch-Pushes starten keinen Lauf.
# - Die ausführliche Prüfung (zusätzlich alle Browsertests im Projekt "phone",
#   rund 35 Minuten) startet nur von Hand: Actions → CI → "Run workflow".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: "Ausführlich: zusätzlich Browsertests (Handy)"
        type: boolean
        default: true
      tests:
        description: "Nur diese Spec-Dateien, z. B. tests/browser/party.spec.ts (leer = alle)"
        type: string
        default: ""

# Ein neuerer Lauf desselben Branches ersetzt den älteren, noch laufenden.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Alles in einem Job: Installation und Build fallen nur einmal an, und
    # GitHub rundet jede Jobdauer einzeln auf volle Minuten auf.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.browser && 60 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:rules
      - run: npm run test:screens
      - run: npm run test:pwa
      - run: npm run test:online
      - run: npm run test:production

      # Ab hier nur die ausführliche Prüfung auf ausdrücklichen Start.
      - name: Chromium installieren
        if: github.event_name == 'workflow_dispatch' && inputs.browser
        run: npx playwright install --with-deps chromium
      - name: Browsertests (Handy)
        if: github.event_name == 'workflow_dispatch' && inputs.browser
        env:
          SPECS: ${{ inputs.tests }}
        run: npm run test:browser -- $SPECS --reporter=list
      - uses: actions/upload-artifact@v7
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.browser
        with:
          name: browser-phone
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
